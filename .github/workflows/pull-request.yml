# The only gate for the Contango fork: frozen install, lint, typecheck, build with a consumer smoke, and the unit suite
# behind both network guard layers. Offline by design: no secrets, no provider credentials, no live integration tests.
# The same jobs run on pull requests and on push to main; workflow_dispatch re-runs them at a chosen commit.
name: Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: yarn lint:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: yarn typecheck

  build:
    name: Build and consumer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile --ignore-scripts

      - name: Build
        run: yarn build

      - name: Consumer smoke
        run: scripts/consumer-smoke.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile --ignore-scripts

      - name: Unit tests (in-process network guard)
        run: yarn test:unit

      - name: Unit tests (container without network)
        run: scripts/test-unit-isolated.sh

  guard-canary:
    name: Guard canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile --ignore-scripts

      - name: Gate wiring self-test
        run: scripts/check-network-guard.selftest.sh

      - name: Network guard gate
        run: scripts/check-network-guard.sh
